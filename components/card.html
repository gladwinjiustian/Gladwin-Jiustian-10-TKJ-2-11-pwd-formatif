<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek - Gladwin Jiustian</title>
    
    <style>
    
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #175ab9;
            margin: 30px auto; 
            background-color: #ffffff;
            border-radius: 8px; 
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            color: #07306b;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card p {
            font-size: 15px;
            color: #2b2b2b;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card a {
            color: #d88633;
            text-decoration: none;
            font-weight: bold;
        }

        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="/assets/images/Screenshot 2026-10-31 080812.png" alt="Proyek Saya">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <p style="text-align: center; margin-top: 40px;">
            <a href="../index.html" style="color: #026cff; text-decoration: underline;">Kembali ke Beranda</a>
        </p>
    </footer>

</body>
</html>
