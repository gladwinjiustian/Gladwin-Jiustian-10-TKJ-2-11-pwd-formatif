<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol - Gladwin Jiustian</title>
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        
        h2 {
            color: darkslategray;
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

       
        .btn-primary {
            background-color: #6366f1;
            color: #ffffff;
        }

       
        .btn-secondary {
            background-color: rgba(203, 213, 225, 0.8);
        }

       
        .btn-outline {
            background-color: #ffffff;
            border: 2px solid rgb(99, 102, 241);
        }

        .btn-send {
            background-color: #f97316;
            color: #ffffff;
        }

        .btn-secondary, .btn-outline {
            color: #1e293b;
        }

        .btn-primary:hover {
            background-color: #4f46e5;
        }

        .btn-secondary:hover {
            background-color: rgba(148, 163, 184, 1);
        }

        .btn-outline:hover {
            background-color: #e0e7ff;
        }

        .btn-send:hover {
            background-color: #ea580c;
        }
    </style>
</head>
<body>

    <main>
        <h2>ntah la</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <p style="margin-top: 40px;">
            <a href="../index.html" style="color: #6366f1; text-decoration: underline;">Kembali ke Beranda</a>
        </p>
    </footer>

</body>
</html>
